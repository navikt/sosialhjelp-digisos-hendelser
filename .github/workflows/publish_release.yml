name: 'Publish Release'
on:
  release:
    types: [published]

jobs:
  publish:
    name: 'Test and Publish Packages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ORG_GRADLE_PROJECT_githubUser: x-access-token
      ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v7
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@navikt'
          package-manager-cache: false # never cache in release builds

      - name: Resolve version from release tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and run tests
        run: ./gradlew build -Pversion=$VERSION
        shell: bash

      - name: Publish Maven (JVM) package
        run: ./gradlew publish -Pversion=$VERSION
        shell: bash

      - name: Build JS library distribution
        run: ./gradlew jsNodeProductionLibraryDistribution -Pversion=$VERSION
        shell: bash

      - name: Publish npm (JS) package
        working-directory: build/dist/js/productionLibrary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name='@navikt/sosialhjelp-digisos-hendelser'
          npm pkg set version="$VERSION"
          npm pkg set repository.type=git
          npm pkg set repository.url='https://github.com/navikt/sosialhjelp-digisos-hendelser.git'
          npm publish
        shell: bash
