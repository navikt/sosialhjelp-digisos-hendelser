apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: sosialhjelp-fiks-service-dev
  namespace: teamdigisos
  labels:
    team: teamdigisos
spec:
  image: {{image}}
  port: 8080
  liveness:
    path: /internal/health
    initialDelay: 20
    timeout: 1
    periodSeconds: 10
    failureThreshold: 10
  readiness:
    path: /internal/health
    initialDelay: 20
    timeout: 1
  prometheus:
    enabled: true
    path: /internal/metrics
  replicas:
    min: 1
    max: 1
  tokenx:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        groups:
          - id: "7357bc5c-8389-435d-8311-46452d356a83" # 0000-GA-Modia_Sosialhjelp_NKS"
          - id: "beca52a8-5551-4db0-9860-78355b796f14" # team digisos
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: "ks:fiks"
  accessPolicy:
    outbound:
      external:
        - host: api.fiks.test.ks.no
        - host: minside.fiks.test.ks.no
        - host: pdl-api.dev-fss-pub.nais.io
      rules:
        - application: norg2
          namespace: org
        - application: skjermede-personer-pip
          namespace: nom
    inbound:
      rules:
        - application: sosialhjelp-innsyn-api-dev
        - application: sosialhjelp-innsyn-api
        - application: sosialhjelp-modia-api-dev
        - application: sosialhjelp-adminpanel-dev
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 256Mi
  valkey:
    - instance: cache
      access: readwrite
  envFrom:
    - secret: fiks-integrasjon-secret
    - secret: fiks-service-secrets
  env:
    - name: FIKS_DIGISOS_ENDPOINT_URL
      value: "https://api.fiks.test.ks.no"
    - name: NORG_ENDPOINT_URL
      value: "http://norg2.org/norg2/api/v1"
    - name: PDL_ENDPOINT_URL
      value: "https://pdl-api.dev-fss-pub.nais.io/graphql"
    - name: SKJERMEDE_PERSONER_ENDPOINT_URL
      value: "http://skjermede-personer-pip.nom"
